name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: swift build
      # Correctness only. Heavy benchmarks (wall-clock gates, million-file fixtures)
      # skip themselves whenever CI=true - Actions sets it automatically - because
      # macOS runners bill at 10x on the free plan and a loaded shared runner produces
      # timing numbers we don't trust anyway. Run them locally with plain `swift test`,
      # or force them here with DIRWIZ_HEAVY_TESTS=1 on a self-hosted runner.
      - name: Test (correctness only)
        run: swift test
